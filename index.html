<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alaa Salah Portfolio</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0c0f;
  color: #fff;
}

/* ===== simple top profile ===== */
.container {
  text-align: center;
  padding-top: 80px;
}

.img-box {
  width: 250px;
  height: 250px;
  margin: auto;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid #ccc;
}

.img-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.name {
  margin-top: 20px;
  font-size: 24px;
  font-weight: bold;
}

/* ===== CERTIFICATES (FIXED UNDER EACH OTHER) ===== */
.cert-gallery {
  display: flex;
  flex-direction: column;   /* 👈 تحت بعض */
  align-items: center;
  gap: 25px;
  margin-top: 50px;
}

.cert-gallery img {
  width: 90%;
  max-width: 900px;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<!-- PROFILE -->
<div class="container">
  <div class="img-box">
    <img src="profile.jpg" alt="profile">
  </div>

  <div class="name">
    Hello 👋 I'm Alaa Salah
  </div>
</div>

<!-- CERTIFICATIONS -->
<h2 style="text-align:center; margin-top:60px;">My Certifications</h2>

<div class="cert-gallery">
  <img src="images/Screenshot 2026-05-13 103738.png">
  <img src="images/Screenshot 2026-05-13 103731.png">
  <img src="images/Screenshot 2026-05-13 103724.png">
  <img src="images/Screenshot 2026-05-13 103716.png">
  <img src="images/Screenshot 2026-05-13 103709.png">
  <img src="images/Screenshot 2026-05-13 103702.png">
</div>

</body>
</html>
