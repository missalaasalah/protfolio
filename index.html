<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alaa Salah Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ===== BASE ===== */
body{
  margin:0;
  font-family:Outfit, Arial;
  background:#0b0c0f;
  color:#e8eaf0;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  z-index:1000;
}

nav a{
  color:#aaa;
  text-decoration:none;
  margin:0 10px;
}

/* SECTIONS */
section{
  padding:90px 20px;
  max-width:1100px;
  margin:auto;
}

/* HERO */
.hero{
  text-align:center;
  padding-top:140px;
}

.hero h1{
  font-size:50px;
}

.hero em{
  color:#00d4a1;
}

/* PROJECT */
.project-card{
  background:#1e2230;
  padding:20px;
  border-radius:12px;
  margin:10px 0;
}

/* CERTS */
.cert-gallery{
  display:flex;
  flex-direction:column;
  gap:20px;
  align-items:center;
}

.cert-gallery img{
  width:90%;
  max-width:800px;
  border-radius:12px;
}

/* CONTACT */
input,textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}

button{
  width:100%;
  padding:12px;
  background:#00d4a1;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div>alaa.salah()</div>
  <div>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#certs">Certs</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Hello 👋 I'm <em>Alaa Salah</em></h1>
  <p>Junior Data Analyst</p>
</section>

<!-- ABOUT -->
<section id="about">
  <h2>About</h2>
  <p>
    I turn data into insights using Python, SQL and Power BI.
  </p>
</section>

<!-- PROJECTS -->
<section id="projects">
  <h2>Projects</h2>

  <div class="project-card">
    TechUni Intelligence Hub
  </div>

  <div class="project-card">
    Sales Dashboard (Power BI)
  </div>

  <div class="project-card">
    Machine Learning Project
  </div>
</section>

<!-- CERTIFICATIONS -->
<section id="certs">
  <h2>My Certifications</h2>

  <div class="cert-gallery">
    <img src="images/Screenshot 2026-05-13 103738.png">
    <img src="images/Screenshot 2026-05-13 103731.png">
    <img src="images/Screenshot 2026-05-13 103724.png">
    <img src="images/Screenshot 2026-05-13 103716.png">
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <h2>Contact</h2>

  <input placeholder="Name">
  <input placeholder="Email">
  <textarea placeholder="Message"></textarea>

  <button onclick="alert('Message sent!')">
    Send
  </button>
</section>

</body>
</html>
