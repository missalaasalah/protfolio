<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alaa Salah Portfolio</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f7fb;
  color:#222;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  background:#111;
  color:#fff;
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  z-index:1000;
}
nav a{
  color:#fff;
  margin-left:15px;
  text-decoration:none;
}

/* HERO */
.hero{
  text-align:center;
  padding:120px 20px 60px;
}
.hero img{
  width:180px;
  height:180px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #ddd;
}
.hero h1{
  margin-top:20px;
}

/* SECTIONS */
section{
  padding:60px 20px;
  max-width:1000px;
  margin:auto;
}

/* CERTS */
.cert-gallery{
  display:flex;
  flex-direction:column;
  gap:20px;
  align-items:center;
}
.cert-gallery img{
  width:90%;
  max-width:800px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* CONTACT */
form{
  display:flex;
  flex-direction:column;
  gap:10px;
}
input,textarea{
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  padding:12px;
  background:#111;
  color:#fff;
  border:none;
  cursor:pointer;
  border-radius:6px;
}
</style>
</head>

<body>

<nav>
  <div>Alaa Salah</div>
  <div>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#certs">Certs</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <img src="profile.jpg" alt="profile">
  <h1>Hello 👋 I'm Alaa Salah</h1>
  <p>Junior Data Analyst</p>
</div>

<!-- ABOUT -->
<section id="about">
  <h2>About</h2>
  <p>I turn data into insights and decisions.</p>
</section>

<!-- PROJECTS -->
<section id="projects">
  <h2>Projects</h2>
  <p>Here you can add your projects.</p>
</section>

<!-- CERTIFICATIONS -->
<section id="certs">
  <h2>My Certifications</h2>
  <div class="cert-gallery">
    <img src="images/1.png">
    <img src="images/2.png">
    <img src="images/3.png">
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <h2>Contact</h2>

  <form onsubmit="sendMessage(event)">
    <input id="name" placeholder="Name">
    <input id="email" placeholder="Email">
    <textarea id="message" placeholder="Message"></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<script>
function sendMessage(e){
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const message = document.getElementById("message").value;

  if(!name || !email || !message){
    alert("Please fill all fields");
    return;
  }

  const mailtoLink =
    `mailto:miss.alaa.salah@gmail.com?subject=Portfolio&body=
Name: ${name}
Email: ${email}
Message: ${message}`;

  window.location.href = mailtoLink;
}
</script>

</body>
</html>
