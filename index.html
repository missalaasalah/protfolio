<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alaa Salah Portfolio</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0c0f;
    color:white;
}

/* NAV */
nav{
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#111;
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
}
nav a{
    color:#aaa;
    margin-left:15px;
    text-decoration:none;
}
nav a:hover{
    color:#00d4a1;
}

/* HERO */
.hero{
    text-align:center;
    padding-top:120px;
}
.hero img{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #00d4a1;
}
.hero h1{
    margin-top:20px;
}

/* SECTION */
section{
    padding:60px 20px;
    max-width:1000px;
    margin:auto;
}

/* CERTIFICATIONS (UNDER EACH OTHER) */
.cert-gallery{
    display:flex;
    flex-direction:column;   /* 👈 تحت بعض */
    gap:20px;
    align-items:center;
}

.cert-gallery img{
    width:90%;
    max-width:700px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.5);
}

/* PROJECTS */
.project{
    background:#1a1d25;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
}

footer{
    text-align:center;
    padding:20px;
    color:#777;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div>alaa.salah()</div>
  <div>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#certs">Certs</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
    <img src="profile.jpg" alt="profile">
    <h1>Hello 👋 I'm Alaa Salah</h1>
    <p>Junior Data Analyst</p>
</div>

<!-- ABOUT -->
<section id="about">
    <h2>About</h2>
    <p>I turn data into insights and stories.</p>
</section>

<!-- PROJECTS -->
<section id="projects">
    <h2>Projects</h2>

    <div class="project">Project 1</div>
    <div class="project">Project 2</div>
</section>

<!-- CERTIFICATIONS -->
<section id="certs">
    <h2>Certifications</h2>

    <div class="cert-gallery">
        <img src="images/cert1.png">
        <img src="images/cert2.png">
        <img src="images/cert3.png">
        <img src="images/cert4.png">
    </div>
</section>

<!-- CONTACT -->
<section id="contact">
    <h2>Contact</h2>
    <p>Email: example@gmail.com</p>
</section>

<footer>
    © 2026 Alaa Salah
</footer>

</body>
</html>
